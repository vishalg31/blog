<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview 02 — Long Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #FAF1E2;
      --ink:    #B53D2A;
      --ink-deep: #8E2D1F;
      --muted:  rgba(181, 61, 42, 0.42);
      --border: rgba(181, 61, 42, 0.18);
      --f-display: 'Bricolage Grotesque', sans-serif;
      --f-body:    'Fraunces', serif;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      overflow: hidden;
    }

    .hero {
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2.5rem;
    }

    /* top bar */
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .back {
      font-family: var(--f-body);
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-decoration: none;
    }
    .nav-label {
      font-family: monospace;
      font-size: 0.68rem;
      letter-spacing: 0.10em;
      color: var(--border);
      text-transform: uppercase;
    }

    /* bottom content */
    .hero-bottom {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 900px;
    }

    .eyebrow {
      font-family: var(--f-body);
      font-style: italic;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 1.4rem;
    }

    .hero-title {
      font-family: var(--f-display);
      font-size: clamp(84px, 16vw, 180px);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 1.8rem;
    }

    .hero-kicker {
      font-family: var(--f-body);
      font-style: italic;
      font-size: 1.12rem;
      line-height: 1.60;
      font-weight: 300;
      color: var(--muted);
      max-width: 500px;
      margin-bottom: 2rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .chip {
      font-family: var(--f-body);
      font-style: italic;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      padding: 0.42em 1.2em;
      border-radius: 100px;
    }
    .chip-filled {
      background: var(--ink);
      color: var(--bg);
    }
    .chip-border {
      border: 1.5px solid var(--border);
      color: var(--muted);
    }

    /* decorative rule */
    .rule {
      position: absolute;
      top: 50%;
      right: 0;
      width: 1px;
      height: 40%;
      transform: translateY(-50%);
      background: linear-gradient(to bottom, transparent, var(--border), transparent);
    }

    /* corner motif */
    .corner-motif {
      position: absolute;
      top: 1.8rem;
      right: 2.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }
    .corner-motif span {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--ink);
      opacity: 0.18;
    }
    .corner-motif span:nth-child(1) { opacity: 0.42; }
    .corner-motif span:nth-child(4) { opacity: 0.42; }

    /* watermark */
    .watermark {
      position: absolute;
      bottom: 2rem;
      right: 2.5rem;
      font-family: monospace;
      font-size: 0.62rem;
      color: rgba(181,61,42,0.20);
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
    }

    /* subtle paper grain texture via background image */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        transparent,
        transparent 119px,
        rgba(181,61,42,0.035) 119px,
        rgba(181,61,42,0.035) 120px
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="rule"></div>

    <div class="corner-motif">
      <span></span><span></span>
      <span></span><span></span>
    </div>

    <div class="hero-top">
      <a class="back" href="#">← back to stories</a>
      <span class="nav-label">01 / 01</span>
    </div>

    <div class="hero-bottom">
      <p class="eyebrow">Builder &nbsp;·&nbsp; June 2026</p>
      <h1 class="hero-title">STORY</h1>
      <p class="hero-kicker">One sentence that tells you what this is about and why it matters to anyone who builds things that actually work.</p>
      <div class="chips">
        <span class="chip chip-filled">Builder</span>
        <span class="chip chip-border">June 2026</span>
        <span class="chip chip-border">Key stat here</span>
      </div>
    </div>

    <div class="watermark">
      Long Table<br>
      Warm cream + rust-red, Bricolage + Fraunces italic
    </div>
  </div>
</body>
</html>
