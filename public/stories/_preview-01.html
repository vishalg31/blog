<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview 01 — Coral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:     #EFE9D9;
      --ink:    #1A1A1A;
      --accent: #E85D5D;
      --muted:  rgba(26, 26, 26, 0.40);
      --border: rgba(26, 26, 26, 0.10);
      --f-display: 'Bebas Neue', sans-serif;
      --f-body:    'Inter', sans-serif;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--f-body);
      overflow: hidden;
    }

    .hero {
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem 2.5rem;
    }

    /* top bar */
    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .back {
      font-family: var(--f-body);
      font-size: 0.70rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
    }
    .nav-label {
      font-size: 0.68rem;
      letter-spacing: 0.10em;
      color: rgba(245,240,232,0.18);
      font-family: monospace;
      text-transform: uppercase;
    }

    /* bottom content */
    .hero-bottom {
      display: flex;
      flex-direction: column;
      gap: 0;
      max-width: 860px;
    }

    .eyebrow {
      font-family: monospace;
      font-size: 0.70rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .hero-title {
      font-family: var(--f-display);
      font-size: clamp(100px, 18vw, 200px);
      line-height: 0.86;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 1.6rem;
    }
    .hero-title .ac { color: var(--accent); }

    .hero-kicker {
      font-size: 1.05rem;
      line-height: 1.65;
      font-weight: 300;
      color: var(--muted);
      max-width: 480px;
      margin-bottom: 2rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .chip {
      font-family: var(--f-body);
      font-size: 0.67rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.38em 1.0em;
      border-radius: 2px;
      font-weight: 500;
    }
    .chip-filled {
      background: var(--accent);
      color: #fff;
    }
    .chip-border {
      border: 1px solid rgba(26,26,26,0.20);
      color: var(--muted);
    }

    /* decorative accent bar */
    .accent-bar {
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--accent) 0%, transparent 100%);
      opacity: 0.7;
    }

    /* watermark */
    .watermark {
      position: absolute;
      bottom: 2rem;
      right: 2.5rem;
      font-family: monospace;
      font-size: 0.62rem;
      color: rgba(26,26,26,0.18);
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
    }

    /* horizontal grid lines — subtle texture */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 79px,
        rgba(26,26,26,0.04) 79px,
        rgba(26,26,26,0.04) 80px
      );
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="accent-bar"></div>

    <div class="hero-top">
      <a class="back" href="#">← Back</a>
      <span class="nav-label">01 / 01</span>
    </div>

    <div class="hero-bottom">
      <p class="eyebrow">Builder &nbsp;·&nbsp; June 2026</p>
      <h1 class="hero-title">ST<span class="ac">OR</span>Y</h1>
      <p class="hero-kicker">One sentence that tells you what this is about and why it matters to anyone who cares about building things that work.</p>
      <div class="chips">
        <span class="chip chip-filled">Builder</span>
        <span class="chip chip-border">June 2026</span>
        <span class="chip chip-border">Key stat here</span>
      </div>
    </div>

    <div class="watermark">
      Coral<br>
      Cream and coral on near-black, Bebas Neue
    </div>
  </div>
</body>
</html>
